version: "3.9"

services:
  sentiment-app:
    build: .
    container_name: sentiment_analysis_app
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
      - ./metrics:/app/metrics
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  sentiment-train:
    build: .
    container_name: sentiment_analysis_train
    command: python main.py --sample
    volumes:
      - ./models:/app/models
      - ./metrics:/app/metrics
    profiles:
      - train
