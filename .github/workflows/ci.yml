name: CI

# On lance les tests a chaque push et a chaque pull request sur main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          # torch en version CPU : bien plus leger et suffisant pour les tests
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # requirements-bert.txt inclut requirements.txt : on teste tout,
          # DistilBERT compris.
          pip install -r requirements-bert.txt
          pip install -r requirements-dev.txt

      - name: Telecharger les stopwords NLTK
        run: python -c "import nltk; nltk.download('stopwords', quiet=True)"

      - name: Lancer les tests
        # Le projet est 100% PyTorch : on evite que transformers charge TensorFlow
        env:
          USE_TF: "0"
          USE_FLAX: "0"
        run: python -m pytest tests/ -v
